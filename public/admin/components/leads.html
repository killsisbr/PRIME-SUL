<div class="fiscal-container" style="padding: 12px; font-family: 'Outfit', sans-serif;">
    <h1 class="v2-title" style="display: none;">LEADS</h1>

    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
        <div>
            <div style="font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--dark); display:flex; align-items:center; gap:10px;">
                <i class="fas fa-users" style="color: #3b82f6;"></i> MEUS LEADS
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600; margin-top:4px;">
                Contatos que pediram simulação de crédito. Leads duplicados de outros vendedores são bloqueados automaticamente.
            </p>
        </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;" id="leadsFilters">
        <button class="lead-filter active" data-status="TODOS">TODOS</button>
        <button class="lead-filter" data-status="novo">NOVO</button>
        <button class="lead-filter" data-status="confirmado">CONFIRMADO</button>
        <button class="lead-filter" data-status="concluido">CONCLUÍDO</button>
    </div>

    <div id="leadsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-weight:800; grid-column:1/-1;">Carregando leads...</div>
    </div>
</div>
