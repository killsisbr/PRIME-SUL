<div class="kbx-root">
    <div class="ps-head" style="margin-bottom:12px;">
        <div>
            <div class="ps-head-title"><i class="fas fa-users" style="color: var(--info);"></i> MEUS LEADS</div>
            <p class="ps-head-desc">Arraste os cards entre as colunas para mudar o status.</p>
        </div>
        <button type="button" class="ps-icon-btn" id="kbx-reload" title="Atualizar" style="width:40px; height:40px; font-size:.95rem; background:var(--secondary);">
            <i class="fas fa-rotate-right"></i>
        </button>
    </div>

    <div class="kbx-toolbar">
        <div class="kbx-search">
            <i class="fas fa-search"></i>
            <input type="text" id="kbx-search" placeholder="Buscar por nome, telefone, cidade...">
        </div>
        <select id="kbx-origem" class="kbx-select">
            <option value="">TODAS ORIGENS</option>
            <option value="SITE">Site</option>
            <option value="SIMULACAO">Simulação</option>
            <option value="INDICACAO">Indicação</option>
        </select>
        <select id="kbx-prio" class="kbx-select">
            <option value="">TODAS PRIORIDADES</option>
            <option value="alta">★ Alta</option>
            <option value="media">★ Média</option>
            <option value="baixa">★ Baixa</option>
        </select>
        <span class="kbx-count" id="kbx-total">0 leads</span>
    </div>

    <div class="kbx-board" id="kbx-board">
        <div class="ps-loading" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> Carregando leads...</div>
    </div>
</div>
