<div class="fiscal-container" style="padding: 12px; font-family: var(--font-body);">
    <h1 class="v2-title" style="display: none;">LEADS</h1>

    <div class="ps-head">
        <div>
            <div class="ps-head-title"><i class="fas fa-users" style="color: var(--info);"></i> MEUS LEADS</div>
            <p class="ps-head-desc">Contatos que pediram simulação de crédito. Leads duplicados de outros vendedores são bloqueados automaticamente.</p>
        </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;" id="leadsFilters">
        <button class="lead-filter active" data-status="TODOS">TODOS</button>
        <button class="lead-filter" data-status="novo">NOVO</button>
        <button class="lead-filter" data-status="contato">EM CONTATO</button>
        <button class="lead-filter" data-status="confirmado">CONFIRMADO</button>
        <button class="lead-filter" data-status="concluido">CONCLUÍDO</button>
    </div>

    <div id="leadsGrid" class="ps-leads-grid">
        <div class="ps-loading" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> Carregando leads...</div>
    </div>
</div>
