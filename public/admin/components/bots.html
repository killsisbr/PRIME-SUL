<div class="bt-root">
    <div class="ps-head" style="margin-bottom:14px;">
        <div>
            <div class="ps-head-title"><i class="fab fa-whatsapp" style="color: var(--ok);"></i> BOTS WHATSAPP</div>
            <p class="ps-head-desc">Conecte os números com QR code e acompanhe a proteção anti-ban em tempo real.</p>
        </div>
        <span class="bt-env" id="bt-env">—</span>
    </div>

    <div class="bt-stats">
        <div><b id="bt-total">0</b><span>NÚMEROS</span></div>
        <div><b id="bt-conectados">0</b><span>CONECTADOS</span></div>
        <div><b id="bt-limite">—</b><span>LIMITE / DIA</span></div>
        <div><b id="bt-cooldown">—</b><span>COOLDOWN</span></div>
    </div>

    <div class="bt-add">
        <input type="text" id="bt-num" class="bt-input" placeholder="Número (DDI+DDD+telefone) ex: 5511999999999">
        <input type="text" id="bt-label" class="bt-input" placeholder="Etiqueta ex: bot-principal" style="flex:0 0 180px;">
        <button type="button" class="bt-add-btn" id="bt-add-btn"><i class="fas fa-plus"></i> ADICIONAR E CONECTAR</button>
    </div>

    <div class="bt-grid" id="bt-grid">
        <div class="ps-loading" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> Carregando bots...</div>
    </div>
</div>
