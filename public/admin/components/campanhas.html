<div class="fiscal-container" style="padding: 12px; font-family: 'Outfit', sans-serif;">
    <h1 class="v2-title" style="display: none;">CAMPANHAS</h1>

    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
        <div>
            <div style="font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--dark); display:flex; align-items:center; gap:10px;">
                <i class="fas fa-paper-plane" style="color: #10b981;"></i> CAMPANHAS DE DISPARO
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600; margin-top:4px;">
                Dispare a mensagem do bot principal para os leads quentes da sua lista.
            </p>
        </div>
        <button class="btn-retro" onclick="openCampaignEditor()"><i class="fas fa-plus"></i> NOVA CAMPANHA</button>
    </div>

    <div id="campaignsList">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-weight:800;">Carregando campanhas...</div>
    </div>
</div>

<!-- Modal nova campanha -->
<div class="v2-submodal-overlay" id="campaignEditorModal" style="display:none;">
    <div class="v2-submodal" style="max-width:760px;">
        <div class="v2-submodal-header"><div><span style="color:var(--primary); font-size:.6rem; font-weight:900; letter-spacing:1.6px;">NOVA CAMPANHA</span><h3>CRIAR CAMPANHA</h3></div><button type="button" class="btn-close-submodal" onclick="closeCampaignEditor()"><i class="fas fa-times"></i></button></div>
        <form id="campaignForm">
            <div class="v2-submodal-body" style="display:grid; grid-template-columns:1fr 1fr; gap:0 14px;">
                <div class="v2-form-group" style="grid-column:1/-1;"><label>Nome da campanha</label><input type="text" id="cName" required placeholder="EX: Leads quentes semana 34"></div>
                <div class="v2-form-group" style="grid-column:1/-1;"><label>Mensagem do bot</label><textarea id="cMessage" rows="3" placeholder="Olá {nome}! Você pediu uma simulação de crédito. Posso pedir para um vendedor encaminhar? Responda SIM para continuar."></textarea></div>
                <div class="v2-form-group" style="grid-column:1/-1;"><label>Número do bot</label><select id="cNumber"><option value="">Nenhum ativo...</option></select></div>
            </div>
            <footer style="display:flex; justify-content:flex-end; gap:10px; padding:12px 22px; border-top:3px solid var(--dark); background:var(--bg);">
                <button type="button" class="btn-retro btn-secondary-retro" onclick="closeCampaignEditor()">Cancelar</button>
                <button type="submit" class="btn-retro"><i class="fas fa-save"></i> Criar</button>
            </footer>
        </form>
    </div>
</div>
