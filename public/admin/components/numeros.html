<div class="num-wrapper">
    <!-- BARRA DE KPIS ANTI-BAN -->
    <div class="num-kpi-bar">
        <div class="num-kpi kpi-active">
            <div class="num-kpi-icon"><i class="fas fa-circle-check"></i></div>
            <div class="num-kpi-data">
                <strong id="numKpiAtivos">0</strong>
                <span>CHIPS ATIVOS</span>
            </div>
        </div>
        <div class="num-kpi kpi-cooling">
            <div class="num-kpi-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="num-kpi-data">
                <strong id="numKpiCooling">0</strong>
                <span>RESFRIANDO</span>
            </div>
        </div>
        <div class="num-kpi kpi-banned">
            <div class="num-kpi-icon"><i class="fas fa-ban"></i></div>
            <div class="num-kpi-data">
                <strong id="numKpiBanidos">0</strong>
                <span>BANIDOS</span>
            </div>
        </div>
        <div class="num-kpi kpi-msgs">
            <div class="num-kpi-icon"><i class="fas fa-paper-plane"></i></div>
            <div class="num-kpi-data">
                <strong id="numKpiMsgs">0</strong>
                <span>ENVIOS HOJE</span>
            </div>
        </div>
    </div>

    <!-- CADASTRO RÁPIDO -->
    <div class="num-card-add">
        <div class="num-card-header">
            <div class="num-card-title">
                <i class="fas fa-plus-circle" style="color:var(--primary);"></i>
                <span>CADASTRAR NOVO CHIP DE DISPARO</span>
            </div>
            <span class="num-card-hint"><i class="fas fa-shield-halved"></i> Proteção anti-ban ativa</span>
        </div>
        <form class="num-add-form" onsubmit="event.preventDefault(); addNumber();">
            <div class="num-field">
                <label for="numNumber"><i class="fas fa-phone"></i> Telefone com DDD (DDI 55)</label>
                <input type="text" id="numNumber" class="ps-input" placeholder="Ex: 5541999991234" autocomplete="off" autofocus>
            </div>
            <div class="num-field">
                <label for="numLabel"><i class="fas fa-tag"></i> Identificação / Rótulo</label>
                <input type="text" id="numLabel" class="ps-input" placeholder="Ex: Chip 01 - Principal" autocomplete="off">
            </div>
            <button type="submit" class="btn-retro num-btn-submit">
                <i class="fas fa-plus"></i> ADICIONAR CHIP
            </button>
        </form>
    </div>

    <!-- LISTA DE CHIPS CADASTRADOS -->
    <div class="num-list-section">
        <div class="num-list-header">
            <div class="num-list-title">
                <i class="fas fa-list-check" style="color:var(--primary);"></i>
                <span>CHIPS EM OPERAÇÃO</span>
            </div>
            <span class="num-count-tag" id="numTotalTag">CARREGANDO...</span>
        </div>
        <div id="numbersList" class="num-list-container">
            <div class="ps-loading"><i class="fas fa-spinner fa-spin"></i> Carregando chips...</div>
        </div>
    </div>
</div>
