<!-- ============ MODAL DE DETALHE DO LEAD ============ -->
<div class="v3-modal-overlay" id="v3-lead-modal" style="display:none;">
    <div class="v3-modal-content">
        <button type="button" class="v3-modal-close-btn" id="v3-close-lead-modal"><i class="fas fa-times"></i></button>
        <div class="v3-modal-body">
            <div class="v3-modal-media" style="border:2.5px solid var(--v3-ink); border-radius:14px; overflow:hidden; height:200px; display:grid; place-items:center; background:var(--v3-cream); margin-bottom:14px;">
                <span style="font:4rem var(--v3-font-title); color:var(--v3-ink);">{initials}</span>
            </div>
            <div>
                <span class="v3-eyebrow">LEAD {origem}</span>
                <h2 style="font:1.8rem/1.1 var(--v3-font-title);">{nome}</h2>
                <p style="color:#756d67; font-size:0.8rem; font-weight:600; margin-top:6px;">{telefone} • {cidade}</p>
                <div style="margin-top:10px;"><span class="v3-tag {status_class}">{status}</span></div>
                <div class="v3-modal-price-tag">Limite: {valor_limite}</div>
                <div class="v3-pizza-builder-box" style="margin-top:14px; padding:14px; background:var(--v3-cream); border:2.5px dashed var(--v3-ink); border-radius:14px;">
                    <div class="v3-builder-title" style="font:1.2rem/1 var(--v3-font-title); margin-bottom:10px;"><i class="fas fa-envelope-open-text"></i> CONFIRMAÇÃO DO LEAD</div>
                    <p style="font-size:0.78rem; font-weight:600; color:#756d67;">O cliente confirmou interesse na simulação. Clique abaixo para o bot do vendedor iniciar o contato.</p>
                </div>
            </div>
        </div>
        <footer class="v3-modal-footer">
            <button type="button" class="v3-btn ghost" id="v3-btn-block-lead"><i class="fas fa-ban"></i> BLOQUEAR</button>
            <button type="button" class="v3-btn whatsapp" style="flex:1;" id="v3-btn-simulate-lead">
                <span><i class="fab fa-whatsapp"></i> REPASSAR PARA BOT DO VENDEDOR</span>
            </button>
        </footer>
    </div>
</div>
