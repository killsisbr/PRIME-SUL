<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Sul — Operador</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2310b981'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial' font-size='28' font-weight='bold'>PS</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/anime.min.js"></script>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/wa-widget.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="/admin/css/components.css">
    <link rel="stylesheet" href="/admin/components/leads.css">
    <script src="/js/wa-widget.js"></script>
    <script src="/js/theme.js"></script>
</head>
<body class="admin-body">

    <!-- ============ HUD COMMAND PALETTE (Ctrl+K) ============ -->
    <div class="hud-overlay" id="hudOverlay">
        <div class="hud-modal">
            <div class="hud-search">
                <i class="fas fa-search"></i>
                <input type="text" id="hudInput" placeholder="Busque ferramentas, relatórios, ajustes..." autocomplete="off">
                <div class="esc-hint">ESC</div>
            </div>
            <div class="hud-content">
                <div class="hud-section-title">Acesso Rápido</div>
                <div class="hud-grid" id="hudGrid"></div>
            </div>
        </div>
    </div>

    <!-- ============ DYNAMIC MODAL (FULLSCREEN) ============ -->
    <div class="hud-overlay" id="dynamicModalOverlay" style="display:none;">
        <div class="hud-modal">
            <div class="hud-search dynamic-modal-header">
                <div style="display:flex; align-items:center; gap:16px; flex:1; align-self:stretch;">
                    <span class="dynamic-modal-orbit"><i class="fas fa-bolt"></i></span>
                    <span id="dynamicModalTitle">FERRAMENTA</span>
                </div>
                <button type="button" class="dynamic-modal-close" onclick="closeDynamicModal()" aria-label="Fechar"><i class="fas fa-times"></i></button>
            </div>
            <div id="dynamicModalBody"></div>
            <div id="dynamicModalFooter">
                <button onclick="closeDynamicModal()" style="cursor:pointer; background:var(--holo-card, #172134); border:1.5px solid var(--holo-border, #27364d); color:#f8fafc; font-weight:800; padding:6px 18px; font-size:0.78rem; border-radius:8px; font-family:'Outfit',sans-serif;">FECHAR (ESC)</button>
            </div>
        </div>
    </div>

    <!-- ============ CONTENT (100% Module HUD) ============ -->
    <main class="content-area">
        <section class="module-hud-shell" id="homeHudShell" style="--module-accent:#10b981; max-width:1180px; margin:0 auto;">

            <div class="module-hud-console">
                <aside class="module-hud-stage">
                    <div class="module-hud-stage-top">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span>PAINEL DO VENDEDOR</span>
                            <i class="fas fa-bolt" style="font-size:0.75rem;"></i>
                        </div>
                        <div class="store-profile stage-store-profile" onclick="logout()" title="Clique para Sair / Logout" style="cursor:pointer; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06); border:1.5px solid var(--holo-border, #27364d); padding:4px 10px; border-radius:999px; transition:all 0.2s;">
                            <div class="avatar" id="storeAvatar" style="width:24px; height:24px; font-size:0.65rem; background:var(--primary, #3b82f6); color:#fff; border-radius:50%; display:grid; place-items:center; font-weight:800;">PS</div>
                            <strong id="storeName" style="font-size:0.75rem; color:#f8fafc; font-weight:700;">Prime Sul</strong>
                            <i class="fas fa-right-from-bracket" style="font-size:0.7rem; color:var(--danger, #ef4444); margin-left:4px;"></i>
                        </div>
                    </div>

                    <!-- BARRA DE PESQUISA (MOVIDA DO CABEÇALHO PARA O CARD DA ESQUERDA) -->
                    <div class="search-trigger stage-search-trigger" id="openHudBtn" style="margin:16px 0 12px 0; width:100%; max-width:none; background:rgba(15,23,42,0.6); border:1.5px solid var(--holo-border, #27364d); box-shadow:none; padding:10px 14px; border-radius:12px;">
                        <i class="fas fa-search" style="color:var(--holo-primary, #0ea5e9);"></i>
                        <span style="color:#94a3b8; font-size:0.8rem;">Buscar ferramenta...</span>
                        <span class="search-shortcut" style="background:#1e293b; border-color:#334155; color:#cbd5e1; font-size:0.6rem; padding:2px 6px;">Ctrl+K</span>
                    </div>

                    <div class="module-hud-copy">
                        <small>COMECE POR AQUI</small>
                        <h2 id="homeHeadline">BOM DIA,<br><span>BORA VENDER.</span></h2>
                        <p>Organize sua lista exclusiva, priorize oportunidades e avance cada contato pelo funil sem perder contexto.</p>
                    </div>
                    <button type="button" class="module-hud-primary" id="homePrimary"><i class="fas fa-arrow-right"></i> ABRIR PRIMEIRA FERRAMENTA</button>
                    <div class="module-hud-metrics">
                        <div><b id="statLeads">0</b><span>LEADS</span></div>
                        <div><b id="statEnvios">0</b><span>ENVIOS</span></div>
                        <div><b id="statConversao">0%</b><span>CONVERSÃO</span></div>
                    </div>
                </aside>
                <div class="module-hud-launchpad" id="homeLaunchpad"></div>
            </div>
        </section>
    </main>

    <script src="/admin/js/module-hud.js"></script>
    <script>
        const me = JSON.parse(localStorage.getItem('prime_sul_user') || 'null');
        if (!me) { window.location.href = '/login.html'; }
        if (me.role === 'admin') { window.location.href = '/admin.html'; }

        // ================= HELPERS =================
        function toast(msg, type = 'ok') {
            let wrap = document.getElementById('psToastWrap');
            if (!wrap) { wrap = document.createElement('div'); wrap.id = 'psToastWrap'; wrap.className = 'ps-toast-wrap'; document.body.appendChild(wrap); }
            const icon = type === 'ok' ? 'fa-circle-check' : type === 'err' ? 'fa-triangle-exclamation' : 'fa-circle-info';
            const el = document.createElement('div');
            el.className = 'ps-toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info');
            const i = document.createElement('i'); i.className = `fas ${icon}`;
            const span = document.createElement('span'); span.textContent = String(msg);
            el.append(i, span);
            wrap.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 220); }, 3200);
        }
        window.toast = toast;
        window.escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function api(path, opts = {}) {
            const res = await fetch('/api' + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                if (res.status === 401) { localStorage.removeItem('prime_sul_user'); window.location.href = '/login.html'; }
                throw Object.assign(new Error(data.error || 'Erro'), { status: res.status, data });
            }
            return data;
        }
        window.api = api;

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
            localStorage.removeItem('prime_sul_user');
            window.location.href = '/login.html';
        }

        // ================= APP GRID (somente módulos do operador) =================
        // Bots anti-ban desabilitados por hora: oculta módulos de bot/anti-ban.
        const BOTS_DISABLED = true;
        const MODULES = [
            { name: 'leads', title: 'Carteira de Clientes', icon: 'fa-address-book', color: '#2563eb', desc: 'Ver todos os clientes cadastrados', badge: 'CLIENTES', border: '#2563eb' },
            { name: 'funil', title: 'Funil de Vendas', icon: 'fa-filter', color: '#3b82f6', desc: 'Conversão por estágio', badge: 'FUNIL', border: '#3b82f6' },
            { name: 'disparo', title: 'Disparo Comercial', icon: 'fa-paper-plane', color: '#ff7417', desc: 'Disparar mensagens para X quantidade de leads com templates', badge: 'DISPARO', border: '#ff7417' },
            { name: 'bots', title: 'Meu WhatsApp', icon: 'fa-mobile-screen-button', color: '#10b981', desc: 'Conectar números e escanear QR', badge: 'WA', border: '#10b981' },
            { name: 'hub', title: 'Hub de Disparo', icon: 'fa-rocket', color: '#ff7417', desc: 'Estratégia anti-ban', badge: 'HUB', border: '#ff7417', bot: true }
        ];
        let visibleModules = MODULES.filter(m => !(BOTS_DISABLED && m.bot));

        function renderLaunchpad() {
            document.getElementById('homeLaunchpad').innerHTML = visibleModules.map((m, i) => `
                <button type="button" class="module-hud-card tone-${(i % 4) + 1}" onclick="openToolV2('${m.name}','${m.title}')" style="--module-accent:${m.color};">
                    <em>0${i + 1}</em>
                    <span><i class="fas ${m.icon}"></i></span>
                    <small>FERRAMENTA</small>
                    <strong>${m.title}</strong>
                    <p>${m.desc}</p>
                    <b>ACESSAR <i class="fas fa-arrow-right"></i></b>
                </button>`).join('') + `<div class="module-hud-tip"><i class="fas fa-lightbulb"></i> Dica: use Ctrl+K para buscar qualquer ferramenta rapidamente.</div>`;
        }

        // HUD grid = app modules + extras
        function renderHud() {
            const items = [
                ...visibleModules.map(m => ({ label: m.title, icon: m.icon, color: m.color, module: m.name })),
                { label: 'Sair da conta', icon: 'fa-sign-out-alt', color: '#df4632', action: 'logout' }
            ];
            document.getElementById('hudGrid').innerHTML = items.map(i => `
                <a href="javascript:void(0)" onclick="${i.action === 'logout' ? 'logout()' : "openToolV2('" + i.module + "','" + i.label + "'); document.getElementById('hudOverlay').classList.remove('active');"}" class="hud-item" style="border-color:${i.color};">
                    <i class="fas ${i.icon}" style="color:${i.color};"></i> ${i.label}
                </a>`).join('');
        }

        // HUD keyboard
        document.getElementById('openHudBtn').onclick = () => { document.getElementById('hudOverlay').classList.add('active'); document.getElementById('hudInput').focus(); };
        document.getElementById('homePrimary').onclick = () => { const f = visibleModules[0]; if (f) openToolV2(f.name, f.title); };
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('hudOverlay').classList.add('active'); document.getElementById('hudInput').focus(); }
            if (e.key === 'Escape') { document.getElementById('hudOverlay').classList.remove('active'); closeDynamicModal(); }
        });
        document.getElementById('hudInput').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('#hudGrid .hud-item').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        });

        // ================= DYNAMIC MODAL =================
        const COMPONENTS_WITH_CSS = ['hub', 'funil', 'leads', 'bots', 'disparo'];
        let activeComponent = null;
        let activeModule = null;
        let _isOpening = false;

        async function openToolV2(componentName, title, afterInit) {
            if (_isOpening) return;
            _isOpening = true;
            const overlay = document.getElementById('dynamicModalOverlay');
            const body = document.getElementById('dynamicModalBody');
            const titleEl = document.getElementById('dynamicModalTitle');
            overlay.classList.add('active');
            overlay.style.display = 'flex';

            // Destrói o módulo anterior antes de montar o novo (evita vazar timers/intervals
            // ao navegar direto de um módulo para outro, ex: Hub/Funil -> Campanhas)
            if (activeComponent) {
                const oldCss = document.getElementById(`v2-css-spec-${activeComponent}`);
                if (oldCss) oldCss.remove();
                activeComponent = null;
            }
            if (activeModule && typeof activeModule.destroy === 'function') {
                try { activeModule.destroy(); } catch (e) { console.error(e); }
                activeModule = null;
            }

            body.innerHTML = '<div class="v2-loading-placeholder"><i class="fas fa-spinner fa-spin"></i> Carregando módulo...</div>';

            const cssId = `v2-css-spec-${componentName}`;
            if (COMPONENTS_WITH_CSS.includes(componentName) && !document.getElementById(cssId)) {
                const link = document.createElement('link');
                link.id = cssId; link.rel = 'stylesheet';
                link.href = `/admin/components/${componentName}.css?v=${Date.now()}`;
                document.head.appendChild(link);
            }

            try {
                const htmlRes = await fetch(`/admin/components/${componentName}.html?cb=${Date.now()}`);
                if (!htmlRes.ok) throw new Error(`Módulo não encontrado: ${componentName}.html (${htmlRes.status})`);
                const htmlText = await htmlRes.text();
                body.innerHTML = htmlText;
                titleEl.textContent = title.toUpperCase();
                
                const modalHeader = document.querySelector('.dynamic-modal-header');
                if (body.querySelector('.v2-hide-header')) {
                    modalHeader.style.display = 'none';
                } else {
                    modalHeader.style.display = 'flex';
                }

                if (body.querySelector('.v2-title')) titleEl.style.display = 'none';
                else titleEl.style.display = 'block';

                let module = null;
                try {
                    module = await import(`/admin/components/${componentName}.js?cb=${Date.now()}-${Math.floor(Math.random()*100000)}`);
                } catch (e) {
                    const jsRes = await fetch(`/admin/components/${componentName}.js?cb=${Date.now()}`);
                    const jsText = await jsRes.text();
                    const blob = new Blob([jsText], { type: 'application/javascript' });
                    const url = URL.createObjectURL(blob);
                    module = await import(url);
                    URL.revokeObjectURL(url);
                }
                activeComponent = componentName;
                activeModule = module;
                let api = {};
                if (module && typeof module.init === 'function') {
                    api = (await module.init({ container: body })) || {};
                }
                window.buildModuleHud?.(body, componentName, title);
                if (typeof afterInit === 'function') {
                    const workspace = body.querySelector('.module-hud-workspace');
                    if (workspace) workspace.classList.add('active');
                    afterInit(api);
                }
            } catch (err) {
                console.error('[Operador] Erro ao instanciar módulo:', err);
                body.innerHTML = `
                    <div style="text-align:center; color:var(--danger); padding:40px; border:3px dashed var(--danger); border-radius:14px; background:#fef2f2;">
                        <i class="fas fa-exclamation-circle" style="font-size:3rem; margin-bottom:16px;"></i>
                        <h3 style="font-family:'Bebas Neue',sans-serif; font-size:2rem; margin-bottom:8px;">Erro na Execução</h3>
                        <p style="font-weight:600; font-size:0.95rem; text-transform:uppercase; color:var(--text-muted);">${window.escapeHtml(err.message)}</p>
                    </div>`;
            } finally {
                _isOpening = false;
            }
        }
        window.openToolV2 = openToolV2;

        function closeDynamicModal() {
            const openSubmodal = [...document.querySelectorAll('.v2-submodal-overlay')]
                .filter(el => getComputedStyle(el).display !== 'none').pop();
            if (openSubmodal) { openSubmodal.style.display = 'none'; return; }
            const openWorkspace = document.querySelector('#dynamicModalBody .module-hud-workspace.active');
            if (openWorkspace) { openWorkspace.classList.remove('active'); return; }
            const overlay = document.getElementById('dynamicModalOverlay');
            overlay.classList.remove('active');
            overlay.style.display = 'none';
            if (activeComponent) {
                const css = document.getElementById(`v2-css-spec-${activeComponent}`);
                if (css) css.remove();
                activeComponent = null;
            }
            if (activeModule && typeof activeModule.destroy === 'function') {
                try { activeModule.destroy(); } catch (e) { console.error(e); }
                activeModule = null;
            }
        }
        window.closeDynamicModal = closeDynamicModal;

        // ================= LOAD STATS =================
        async function loadStats() {
            try {
                const counts = await api('/leads/counts');
                document.getElementById('statLeads').textContent = counts.leads;
                document.getElementById('statEnvios').textContent = counts.envios;
                document.getElementById('statConversao').textContent = counts.conversao + '%';
            } catch (e) { console.error(e); }
        }

        // Greeting + date
        const h = new Date().getHours();
        let g = 'BOM DIA';
        if (h >= 12 && h < 18) g = 'BOA TARDE';
        else if (h >= 18) g = 'BOA NOITE';

        document.getElementById('storeName').textContent = me.name;
        document.getElementById('storeAvatar').textContent = me.name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        document.getElementById('homeHeadline').innerHTML = `${g},<br><span>${me.name.split(' ')[0].toUpperCase()}.</span>`;

        renderLaunchpad();
        renderHud();
        loadStats();
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
